name: Build and Publish XenForo Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight source validation
        shell: bash
        run: |
          find upload/src/addons/Warext/Clans -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          root = Path('upload/src/addons/Warext/Clans')
          addon = json.loads((root / 'addon.json').read_text(encoding='utf-8'))
          if addon.get('version_id') != 1001030 or addon.get('version_string') != '1.0.3':
              raise SystemExit('Expected release version is 1.0.3 / 1001030')

          for path in sorted((root / '_data').glob('*.xml')):
              ET.parse(path)
          ET.parse('languages/English.xml')
          ET.parse('languages/Turkish.xml')

          templates = ET.parse(root / '_data/templates.xml').getroot()
          titles = {node.attrib.get('title') for node in templates.findall('template')}
          required = {'wx_clans_admin_manage', 'wx_clans_admin_delete', 'wx_clans_admin_member_remove'}
          missing = sorted(required - titles)
          if missing:
              raise SystemExit('Missing Admin CP templates: ' + ', '.join(missing))

          nav = ET.parse(root / '_data/admin_navigation.xml').getroot()
          nav_ids = {node.attrib.get('navigation_id') for node in nav.findall('admin_navigation_entry')}
          if 'wxClansManagement' not in nav_ids:
              raise SystemExit('wxClansManagement Admin CP navigation entry is missing')
          PY

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('upload/src/addons/Warext/Clans/addon.json', encoding='utf-8'))['version_string'])")
          SAFE_VERSION=$(printf '%s' "$VERSION" | tr ' ' '-')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "safe_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "file=Warext-Studios-XenForo-Klan-Grup-Sistemi-v$SAFE_VERSION.zip" >> "$GITHUB_OUTPUT"
          LOWER_VERSION=$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')
          if printf '%s' "$LOWER_VERSION" | grep -Eq '(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build direct-install ZIP
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          zip -q -r "dist/${{ steps.version.outputs.file }}" upload -x '*/.DS_Store' '*/Thumbs.db'
      - name: Validate package
        shell: bash
        run: |
          test -s "dist/${{ steps.version.outputs.file }}"
          unzip -Z1 "dist/${{ steps.version.outputs.file }}" | grep -qx 'upload/src/addons/Warext/Clans/addon.json'
          if unzip -Z1 "dist/${{ steps.version.outputs.file }}" | grep -E '(^|/)(\.git|\.github|README\.md|CHANGELOG\.md|SECURITY\.md|CONTRIBUTING\.md|LICENSE|_output)($|/)' ; then
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xenforo-clans-${{ steps.version.outputs.safe_version }}
          path: dist/${{ steps.version.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.version.outputs.file }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<EOF2
          ## Türkçe

          XenForo Admin CP → **Add-ons → Install/upgrade from archive** üzerinden doğrudan yüklenebilir pakettir. ZIP kökünde yalnızca \`upload/\` dizini bulunur.

          Sürüm: **$VERSION**

          Detaylı değişiklikler için repodaki \`CHANGELOG.md\` dosyasını inceleyin.

          ---

          ## English

          Direct-install package for XenForo Admin CP → **Add-ons → Install/upgrade from archive**. The ZIP root contains only the \`upload/\` directory.

          Version: **$VERSION**

          See \`CHANGELOG.md\` in the repository for detailed changes.
          EOF2
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          RELEASE_FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Warext Studios XenForo Klan & Grup Sistemi $VERSION" --notes-file /tmp/release-notes.md "${RELEASE_FLAGS[@]}"
            gh release upload "$TAG" "dist/$FILE" languages/Turkish.xml languages/English.xml --clobber
          else
            gh release create "$TAG" "dist/$FILE" languages/Turkish.xml languages/English.xml --target "$GITHUB_SHA" --title "Warext Studios XenForo Klan & Grup Sistemi $VERSION" --notes-file /tmp/release-notes.md "${RELEASE_FLAGS[@]}"
          fi
