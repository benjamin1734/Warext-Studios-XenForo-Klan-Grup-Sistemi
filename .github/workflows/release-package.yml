name: Build and Publish XenForo Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('upload/src/addons/Warext/Clans/addon.json', encoding='utf-8'))['version_string'])")
          SAFE_VERSION=$(printf '%s' "$VERSION" | tr ' ' '-')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "safe_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "file=Warext-Studios-XenForo-Klan-Grup-Sistemi-v$SAFE_VERSION.zip" >> "$GITHUB_OUTPUT"
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -vx "v$SAFE_VERSION" | head -n 1 || true)
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          LOWER_VERSION=$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')
          if printf '%s' "$LOWER_VERSION" | grep -Eq '(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build direct-install ZIP
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          zip -q -r "dist/${{ steps.version.outputs.file }}" upload -x '*/.DS_Store' '*/Thumbs.db'

      - name: Build UPDATE ZIP
        if: steps.version.outputs.previous_tag != ''
        shell: bash
        env:
          PREV_TAG: ${{ steps.version.outputs.previous_tag }}
          SAFE_VERSION: ${{ steps.version.outputs.safe_version }}
        run: |
          PREV_SAFE=${PREV_TAG#v}
          UPDATE_FILE="Warext-Clans-${PREV_SAFE}-to-${SAFE_VERSION}-UPDATE.zip"
          rm -rf /tmp/wxclans-update
          mkdir -p /tmp/wxclans-update
          git diff --name-only --diff-filter=ACMRT "$PREV_TAG"..HEAD -- upload/ | while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "/tmp/wxclans-update/$(dirname "$path")"
            cp "$path" "/tmp/wxclans-update/$path"
          done
          git diff --name-only --diff-filter=D "$PREV_TAG"..HEAD -- upload/ > /tmp/wxclans-update/UPDATE-DELETE.txt
          if [ ! -s /tmp/wxclans-update/UPDATE-DELETE.txt ]; then
            rm -f /tmp/wxclans-update/UPDATE-DELETE.txt
          fi
          if find /tmp/wxclans-update -type f | grep -q .; then
            (cd /tmp/wxclans-update && zip -q -r "$GITHUB_WORKSPACE/dist/$UPDATE_FILE" .)
            echo "UPDATE_FILE=$UPDATE_FILE" >> "$GITHUB_ENV"
          fi

      - name: Validate package
        shell: bash
        run: |
          test -s "dist/${{ steps.version.outputs.file }}"
          unzip -Z1 "dist/${{ steps.version.outputs.file }}" | grep -qx 'upload/src/addons/Warext/Clans/addon.json'
          if unzip -Z1 "dist/${{ steps.version.outputs.file }}" | grep -E '(^|/)(\.git|\.github|README\.md|CHANGELOG\.md|SECURITY\.md|CONTRIBUTING\.md|LICENSE|_output)($|/)' ; then
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xenforo-clans-${{ steps.version.outputs.safe_version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.version.outputs.file }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<EOF2
          ## Türkçe

          XenForo Admin CP → **Add-ons → Install/upgrade from archive** üzerinden doğrudan yüklenebilir pakettir. ZIP kökünde yalnızca \`upload/\` dizini bulunur.

          Sürüm: **$VERSION**

          Detaylı değişiklikler için repodaki \`CHANGELOG.md\` dosyasını inceleyin.

          ---

          ## English

          Direct-install package for XenForo Admin CP → **Add-ons → Install/upgrade from archive**. The ZIP root contains only the \`upload/\` directory.

          Version: **$VERSION**

          See \`CHANGELOG.md\` in the repository for detailed changes.
          EOF2
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          RELEASE_FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Warext Studios XenForo Klan & Grup Sistemi $VERSION" --notes-file /tmp/release-notes.md "${RELEASE_FLAGS[@]}"
            gh release upload "$TAG" "dist/$FILE" --clobber
            if [ -n "${UPDATE_FILE:-}" ] && [ -f "dist/$UPDATE_FILE" ]; then
              gh release upload "$TAG" "dist/$UPDATE_FILE" --clobber
            fi
          else
            ASSETS=("dist/$FILE")
            if [ -n "${UPDATE_FILE:-}" ] && [ -f "dist/$UPDATE_FILE" ]; then
              ASSETS+=("dist/$UPDATE_FILE")
            fi
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "Warext Studios XenForo Klan & Grup Sistemi $VERSION" --notes-file /tmp/release-notes.md "${RELEASE_FLAGS[@]}"
          fi
