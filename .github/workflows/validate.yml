name: XenForo Add-on Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: find upload/src/addons/Warext/Clans -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Source comment policy
        run: |
          php <<'PHP'
          <?php
          $root = 'upload/src/addons/Warext/Clans';
          $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root));
          $violations = [];
          foreach ($it as $file)
          {
              if (!$file->isFile() || strtolower($file->getExtension()) !== 'php')
              {
                  continue;
              }
              foreach (token_get_all(file_get_contents($file->getPathname())) as $token)
              {
                  if (is_array($token) && ($token[0] === T_COMMENT || $token[0] === T_DOC_COMMENT))
                  {
                      $violations[] = $file->getPathname() . ':' . $token[2];
                  }
              }
          }
          if ($violations)
          {
              fwrite(STDERR, "PHP source comments are not allowed:\n" . implode("\n", $violations) . "\n");
              exit(1);
          }
          PHP

  xenforo-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate add-on data and cross references
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          root = Path('upload/src/addons/Warext/Clans')
          data = root / '_data'

          addon = json.loads((root / 'addon.json').read_text(encoding='utf-8'))
          if addon.get('version_id') != 1000130 or addon.get('version_string') != '0.13.0 RC':
              raise SystemExit('Expected version is 0.13.0 RC / 1000130')
          if addon.get('require', {}).get('XF', [0])[0] != 2030000:
              raise SystemExit('XenForo 2.3.0+ requirement is missing')
          if addon.get('require', {}).get('php', [''])[0] != '8.1.0':
              raise SystemExit('PHP 8.1.0+ requirement is missing')

          if (root / '_output').exists():
              raise SystemExit('_output must not be committed to the installable source tree')

          trees = {}
          for path in sorted(data.glob('*.xml')):
              trees[path.name] = ET.parse(path)
              print('parsed', path)

          required_data = {
              'admin_navigation.xml', 'admin_permission.xml', 'class_extensions.xml',
              'content_type_fields.xml', 'navigation.xml', 'option_groups.xml',
              'options.xml', 'permission_interface_groups.xml', 'permissions.xml',
              'phrases.xml', 'routes.xml', 'template_modifications.xml', 'templates.xml', 'cron.xml'
          }
          missing = sorted(required_data - set(trees))
          if missing:
              raise SystemExit('Missing XenForo _data files: ' + ', '.join(missing))

          limit_checks = [
              ('admin_navigation.xml', './/admin_navigation_entry', ['navigation_id', 'parent_navigation_id', 'admin_permission_id']),
              ('admin_permission.xml', './/admin_permission', ['admin_permission_id']),
              ('permission_interface_groups.xml', './/interface_group', ['interface_group_id']),
              ('permissions.xml', './/permission', ['permission_group_id', 'permission_id', 'interface_group_id']),
              ('option_groups.xml', './/group', ['group_id']),
              ('options.xml', './/option', ['option_id']),
              ('routes.xml', './/route', ['route_prefix', 'sub_name', 'context']),
              ('cron.xml', './/entry', ['entry_id'])
          ]
          errors = []
          for filename, selector, attrs in limit_checks:
              for node in trees[filename].getroot().findall(selector):
                  for attr in attrs:
                      value = node.attrib.get(attr, '')
                      if value and len(value) > 25:
                          errors.append(f'{filename}: {attr}={value} ({len(value)})')
          if errors:
              raise SystemExit('XenForo identifier length limit exceeded:\n' + '\n'.join(errors))

          admin_perm_ids = {e.attrib.get('admin_permission_id') for e in trees['admin_permission.xml'].getroot().findall('admin_permission')}
          if 'wxClansManage' not in admin_perm_ids:
              raise SystemExit('wxClansManage admin permission is missing')

          nav = {e.attrib.get('navigation_id'): e for e in trees['admin_navigation.xml'].getroot().findall('admin_navigation_entry')}
          required_nav = {'wxClans', 'wxClansApplications', 'wxClansIdentity', 'wxClansOwnership', 'wxClansLifecycle', 'wxClansMaintenance', 'wxClansSettings'}
          if not required_nav.issubset(nav):
              raise SystemExit('Admin navigation entries are missing: ' + ', '.join(sorted(required_nav - set(nav))))
          for key in ('wxClans', 'wxClansApplications', 'wxClansIdentity', 'wxClansOwnership', 'wxClansLifecycle', 'wxClansMaintenance'):
              if nav[key].attrib.get('admin_permission_id') != 'wxClansManage':
                  raise SystemExit(f'{key} is not protected by wxClansManage')
          if nav['wxClansSettings'].attrib.get('admin_permission_id') != 'option':
              raise SystemExit('Settings navigation must use XenForo option permission')

          permissions = {(e.attrib.get('permission_group_id'), e.attrib.get('permission_id')) for e in trees['permissions.xml'].getroot().findall('permission')}
          expected_permissions = {('wxClans', 'view'), ('wxClans', 'apply'), ('wxClans', 'moderate')}
          if not expected_permissions.issubset(permissions):
              raise SystemExit('Required wxClans permissions are missing')

          routes = trees['routes.xml'].getroot().findall('route')
          for route in routes:
              controller = route.attrib.get('controller', '')
              if ':' not in controller:
                  continue
              addon_prefix, class_name = controller.split(':', 1)
              if addon_prefix != 'Warext\\Clans':
                  raise SystemExit('Unexpected route controller prefix: ' + controller)
              area = 'Admin' if route.attrib.get('route_type') == 'admin' else 'Pub'
              file = root / area / 'Controller' / f'{class_name}.php'
              if not file.is_file():
                  raise SystemExit(f'Route controller does not exist: {controller} -> {file}')

          admin_controllers = list((root / 'Admin' / 'Controller').glob('*.php'))
          for file in admin_controllers:
              source = file.read_text(encoding='utf-8')
              if "assertAdminPermission('wxClansManage')" not in source:
                  raise SystemExit(f'Admin controller is missing wxClansManage assertion: {file}')

          templates = trees['templates.xml'].getroot().findall('template')
          template_titles = {t.attrib.get('title') for t in templates}
          required_templates = {
              'wx_clans_list', 'wx_clans_view', 'wx_clans_manage', 'wx_clans_my',
              'wx_clans_admin_list', 'wx_clans_admin_applications',
              'wx_clans_admin_identity_changes', 'wx_clans_admin_ownership_transfers',
              'wx_clans_admin_lifecycle_requests', 'report_content_wx_clan',
              'report_content_wx_clan_announcement', 'wx_clans_user_badges',
              'alert_wx_clan_lifecycle_approved', 'alert_wx_clan_lifecycle_rejected',
              'wx_clans_admin_force_owner', 'wx_clans_admin_maintenance',
              'alert_wx_clan_moderation_status_changed', 'alert_wx_clan_ownership_forced'
          }
          if not required_templates.issubset(template_titles):
              raise SystemExit('Required templates missing: ' + ', '.join(sorted(required_templates - template_titles)))

          for file in root.rglob('*.php'):
              source = file.read_text(encoding='utf-8')
              for match in re.finditer(r"->view\([^,]+,\s*'([^']+)'", source):
                  title = match.group(1)
                  if title not in template_titles:
                      raise SystemExit(f'Controller references missing template {title}: {file}')

          fields = {(e.attrib.get('content_type'), e.attrib.get('field_name')): (e.text or '').strip() for e in trees['content_type_fields.xml'].getroot().findall('field')}
          required_fields = {
              ('wx_clan', 'entity'): 'Warext\\Clans:Clan',
              ('wx_clan', 'alert_handler_class'): 'Warext\\Clans\\Alert\\Clan',
              ('wx_clan', 'report_handler_class'): 'Warext\\Clans\\Report\\Clan',
              ('wx_clan', 'moderator_log_handler_class'): 'Warext\\Clans\\ModeratorLog\\Clan',
              ('wx_clan_announcement', 'entity'): 'Warext\\Clans:ClanAnnouncement',
              ('wx_clan_announcement', 'report_handler_class'): 'Warext\\Clans\\Report\\Announcement'
          }
          for key, value in required_fields.items():
              if fields.get(key) != value:
                  raise SystemExit(f'Content type field mismatch: {key} -> {fields.get(key)!r}')

          required_php = [
              root / 'Service/Clan/LifecycleManager.php',
              root / 'Service/Ownership/Manager.php',
              root / 'Service/Identity/Manager.php',
              root / 'Service/Join/Manager.php',
              root / 'Service/Invitation/Manager.php',
              root / 'Service/Maintenance.php',
              root / 'Service/Moderation/StatusManager.php',
              root / 'Service/Ownership/AdminTransfer.php',
              root / 'Cron/Maintenance.php',
              root / 'Report/Clan.php',
              root / 'Report/Announcement.php',
              root / 'ModeratorLog/Clan.php',
              root / 'XF/Entity/User.php'
          ]
          missing_php = [str(p) for p in required_php if not p.is_file()]
          if missing_php:
              raise SystemExit('Required source files missing:\n' + '\n'.join(missing_php))

          option_ids = {e.attrib.get('option_id') for e in trees['options.xml'].getroot().findall('option')}
          for option_id in ('wxClansMaxMemberships', 'wxClansMaxOwned', 'wxClansInviteDays', 'wxClansReservedTags', 'wxClansReservedNames'):
              if option_id not in option_ids:
                  raise SystemExit('Required option is missing: ' + option_id)

          cron_entries = trees['cron.xml'].getroot().findall('entry')
          maintenance_cron = next((e for e in cron_entries if e.attrib.get('entry_id') == 'wx_clans_maintenance'), None)
          if maintenance_cron is None:
              raise SystemExit('Clan maintenance cron entry is missing')
          if maintenance_cron.attrib.get('cron_class') != r'Warext\Clans\Cron\Maintenance' or maintenance_cron.attrib.get('cron_method') != 'run':
              raise SystemExit('Clan maintenance cron callback is invalid')

          repository_source = (root / 'Repository/Clan.php').read_text(encoding='utf-8')
          for needle in ('isTagReserved', 'isTitleReserved', 'isTitleAvailable'):
              if needle not in repository_source:
                  raise SystemExit('Reserved clan identity protection is incomplete: ' + needle)

          for service_path in (root / 'Service/Application/SubmitCreate.php', root / 'Service/Application/Decision.php', root / 'Service/Identity/Manager.php'):
              service_source = service_path.read_text(encoding='utf-8')
              if 'isTagReserved' not in service_source or 'isTitleReserved' not in service_source:
                  raise SystemExit('Reserved identity checks are missing from ' + str(service_path))

          public_controller = (root / 'Pub/Controller/Clan.php').read_text(encoding='utf-8')
          if "status = 'expired'" in public_controller or "->isExpired()" in public_controller:
              raise SystemExit('GET clan pages must not mutate invitation expiry state; maintenance service must handle expiry')
          if r"Warext\\Clans:Moderation\\StatusManager" not in public_controller:
              raise SystemExit('Public clan moderation status must use StatusManager')

          admin_controller = (root / 'Admin/Controller/Clan.php').read_text(encoding='utf-8')
          for needle in ('actionForceOwner', r'Ownership\\AdminTransfer', 'actionMaintenance', r'Warext\\Clans:Maintenance'):
              if needle not in admin_controller:
                  raise SystemExit('0.8 Admin CP clan management feature is missing: ' + needle)

          alert_handler = (root / 'Alert/Clan.php').read_text(encoding='utf-8')
          opt_match = re.search(r'getOptOutActions\(\).*?return\s*\[(.*?)\];', alert_handler, flags=re.S)
          opt_actions = set(re.findall(r"'([a-z_]+)'", opt_match.group(1))) if opt_match else set()
          expected_alert_actions = {
              'invited', 'member_joined', 'member_added', 'manager_assigned', 'clan_approved',
              'join_application', 'application_approved', 'application_rejected',
              'identity_change_approved', 'identity_change_rejected',
              'ownership_transfer_requested', 'ownership_transfer_approved', 'ownership_transfer_rejected',
              'lifecycle_approved', 'lifecycle_rejected', 'ownership_forced', 'moderation_status_changed'
          }
          missing_opt = expected_alert_actions - opt_actions
          if missing_opt:
              raise SystemExit('Alert handler actions are missing: ' + ', '.join(sorted(missing_opt)))
          missing_alert_templates = [action for action in expected_alert_actions if f'alert_wx_clan_{action}' not in template_titles]
          if missing_alert_templates:
              raise SystemExit('Alert templates are missing: ' + ', '.join(sorted(missing_alert_templates)))

          phrase_titles = {e.attrib.get('title') for e in trees['phrases.xml'].getroot().findall('phrase')}
          if 'cron_entry.wx_clans_maintenance' not in phrase_titles:
              raise SystemExit('Maintenance cron phrase is missing')
          missing_alert_phrases = [action for action in expected_alert_actions if f'alert_opt_out.wx_clan_{action}' not in phrase_titles]
          if missing_alert_phrases:
              raise SystemExit('Alert opt-out phrases are missing: ' + ', '.join(sorted(missing_alert_phrases)))

          setup = (root / 'Setup.php').read_text(encoding='utf-8')
          for needle in [
              "applyMissingGroupPermissions(2, ['view', 'apply'])",
              "applyMissingGroupPermissions(3, ['view', 'apply', 'moderate'])",
              "applyMissingGroupPermissions(4, ['view', 'apply', 'moderate'])",
              "wxClansManage"
          ]:
              if needle not in setup:
                  raise SystemExit('Default permission setup is incomplete: ' + needle)

          lifecycle = (root / 'Service/Clan/LifecycleManager.php').read_text(encoding='utf-8')
          if "status !== 'closed'" not in lifecycle or "['close', 'reopen']" not in lifecycle:
              raise SystemExit('Lifecycle state protection is incomplete')

          clan_entity = (root / 'Entity/Clan.php').read_text(encoding='utf-8')
          for needle in ['member_list_visibility', 'announcement_visibility', 'canViewMemberList', 'canViewAnnouncements']:
              if needle not in clan_entity:
                  raise SystemExit('0.9 clan privacy support is incomplete: ' + needle)

          member_manager = (root / 'Service/Clan/MemberManager.php').read_text(encoding='utf-8')
          for needle in ['wxClansMaxMembersPerClan', 'wxClansMaxManagersPerClan']:
              if needle not in member_manager:
                  raise SystemExit('0.9 membership limits are incomplete: ' + needle)

          join_manager = (root / 'Service/Join/Manager.php').read_text(encoding='utf-8')
          invite_manager = (root / 'Service/Invitation/Manager.php').read_text(encoding='utf-8')
          if 'wxClansJoinCooldownHours' not in join_manager or 'wxClansInviteCooldown' not in invite_manager:
              raise SystemExit('0.9 anti-spam cooldowns are incomplete')

          option_ids = {e.attrib.get('option_id') for e in trees['options.xml'].getroot().findall('option')}
          for option_id in ['wxClansMaxMembersPerClan','wxClansMaxManagersPerClan','wxClansJoinCooldownHours','wxClansInviteCooldown']:
              if option_id not in option_ids:
                  raise SystemExit('0.9 option missing: ' + option_id)

          if 'wxClansMembersPerPage' not in option_ids:
              raise SystemExit('0.10 member pagination option is missing')

          ownership = (root / 'Service/Ownership/Manager.php').read_text(encoding='utf-8')
          admin_transfer = (root / 'Service/Ownership/AdminTransfer.php').read_text(encoding='utf-8')
          if "where('is_owner', 0)" not in member_manager or 'managerCountAfter' not in ownership or 'managerCountAfter' not in admin_transfer:
              raise SystemExit('0.10 manager-limit ownership hardening is incomplete')

          public_controller = (root / 'Pub/Controller/Clan.php').read_text(encoding='utf-8')
          for needle in ['memberPerPage', 'memberTotal', 'limitByPage']:
              if needle not in public_controller:
                  raise SystemExit('0.10 member pagination is incomplete: ' + needle)

          if "hasPermission('wxClans', 'view')" not in public_controller or "hasPermission('wxClans', 'apply')" not in public_controller:
              raise SystemExit('0.11 public permission enforcement is incomplete')

          clan_entity = (root / 'Entity/Clan.php').read_text(encoding='utf-8')
          if "hasPermission('wxClans', 'view')" not in clan_entity:
              raise SystemExit('0.11 entity-level clan view permission is missing')

          navigation_xml = (data / 'navigation.xml').read_text(encoding='utf-8')
          if "hasPermission('wxClans', 'view')" not in navigation_xml:
              raise SystemExit('0.11 navigation permission condition is missing')

          role_manager = (root / 'Service/Clan/RoleManager.php').read_text(encoding='utf-8')
          field_manager = (root / 'Service/ApplicationForm/Manager.php').read_text(encoding='utf-8')
          announcement_manager = (root / 'Service/Clan/AnnouncementManager.php').read_text(encoding='utf-8')
          submit_create = (root / 'Service/Application/SubmitCreate.php').read_text(encoding='utf-8')

          for needle in ['wxClansMaxRoles', 'wxClansMaxFields', 'wxClansMaxAnnouncements']:
              if needle not in option_ids:
                  raise SystemExit('0.12 abuse-limit option missing: ' + needle)

          if 'wxClansMaxRoles' not in role_manager or 'wxClansMaxFields' not in field_manager or 'wxClansMaxAnnouncements' not in announcement_manager:
              raise SystemExit('0.12 service-level resource limits are incomplete')
          if '20000' not in announcement_manager or '20000' not in submit_create:
              raise SystemExit('0.12 content length validation is incomplete')
          if 'mb_strlen($value) > 255' not in public_controller:
              raise SystemExit('0.12 media URL length validation is missing')

          announcement_entity = (root / 'Entity/ClanAnnouncement.php').read_text(encoding='utf-8')
          if 'canView($error)' not in announcement_entity.split('public function canReport', 1)[1]:
              raise SystemExit('0.12.1 announcement report privacy check is missing')

          if 'beginTransaction()' not in role_manager or 'beginTransaction()' not in field_manager:
              raise SystemExit('0.12.1 multi-record delete transaction hardening is incomplete')
          if 'Field key must be unique within the clan.' not in field_manager:
              raise SystemExit('0.12.1 application field-key uniqueness check is missing')

          setup_text = (root / 'Setup.php').read_text(encoding='utf-8')
          install_text = setup_text.split('public function installStep2', 1)[0]
          install_tables = {}
          current_table = None
          for line in install_text.splitlines():
              table_match = re.search(r"createTable\('([^']+)'", line)
              if table_match:
                  current_table = table_match.group(1)
                  install_tables[current_table] = set()
                  continue
              if current_table:
                  col_match = re.search(r"addColumn\('([^']+)'", line)
                  if col_match:
                      install_tables[current_table].add(col_match.group(1))
                  if line.strip() == '});':
                      current_table = None

          entity_mismatches = []
          for entity_path in sorted((root / 'Entity').glob('*.php')):
              entity_text = entity_path.read_text(encoding='utf-8')
              table_match = re.search(r"\$structure->table\s*=\s*'([^']+)'", entity_text)
              columns_match = re.search(r"\$structure->columns\s*=\s*\[([\s\S]*?)\n\s*\];", entity_text)
              if not table_match or not columns_match:
                  continue
              table_name = table_match.group(1)
              entity_cols = set(re.findall(r"^\s*'([^']+)'\s*=>", columns_match.group(1), flags=re.M))
              if table_name not in install_tables:
                  entity_mismatches.append(f'{entity_path.name}: install table {table_name} missing')
                  continue
              missing = sorted(entity_cols - install_tables[table_name])
              extra = sorted(install_tables[table_name] - entity_cols)
              if missing or extra:
                  entity_mismatches.append(f'{entity_path.name}: missing={missing}, extra={extra}')
          if entity_mismatches:
              raise SystemExit('Entity/install schema mismatch: ' + '; '.join(entity_mismatches))

          for controller_path in sorted(root.glob('**/Controller/*.php')):
              controller_text = controller_path.read_text(encoding='utf-8')
              if '$this->db()' in controller_text:
                  raise SystemExit(f'Unsupported controller db() call found in {controller_path.relative_to(root)}')

          presentation = (root / 'Util/Presentation.php').read_text(encoding='utf-8')
          for icon in ['fa-users','fa-shield','fa-crown','fa-star','fa-bolt','fa-fire','fa-gamepad','fa-trophy','fa-flag','fa-gem','fa-heart','fa-circle']:
              if icon not in presentation:
                  raise SystemExit('0.13 XenForo icon whitelist is incomplete: ' + icon)

          if 'tag_icon' not in clan_entity or 'manager_banner_icon' not in clan_entity:
              raise SystemExit('0.13 clan icon columns are missing')
          application_entity = (root / 'Entity/ClanApplication.php').read_text(encoding='utf-8')
          if 'requested_tag_icon' not in application_entity or 'requested_manager_banner_icon' not in application_entity:
              raise SystemExit('0.13 application icon columns are missing')

          picker_js = Path('upload/js/warext/clans/identity-picker.js')
          if not picker_js.is_file():
              raise SystemExit('0.13 identity picker JavaScript is missing')
          picker_text = picker_js.read_text(encoding='utf-8')
          for needle in ['data-wx-color-picker', 'hsvToRgb', 'data-wx-icon-value']:
              if needle not in picker_text:
                  raise SystemExit('0.13 identity picker JavaScript is incomplete: ' + needle)

          release_workflow = Path('.github/workflows/release-package.yml').read_text(encoding='utf-8')
          if 'Build UPDATE ZIP' in release_workflow or 'UPDATE_FILE' in release_workflow:
              raise SystemExit('XenForo release workflow must not generate separate UPDATE ZIP files')

          print(f'Validated {len(trees)} XML files, {len(templates)} templates and {len(routes)} routes.')
          PY

  package-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build direct-install archive
        run: |
          VERSION=$(python -c "import json; print(json.load(open('upload/src/addons/Warext/Clans/addon.json', encoding='utf-8'))['version_string'])")
          SAFE_VERSION=$(printf '%s' "$VERSION" | tr ' ' '-')
          PACKAGE="Warext-Studios-XenForo-Klan-Grup-Sistemi-v${SAFE_VERSION}.zip"
          mkdir -p dist
          zip -q -r "dist/$PACKAGE" upload -x '*/.DS_Store' '*/Thumbs.db'
          test -s "dist/$PACKAGE"
          unzip -Z1 "dist/$PACKAGE" | grep -qx 'upload/src/addons/Warext/Clans/addon.json'
          if unzip -Z1 "dist/$PACKAGE" | grep -E '(^|/)(\.git|\.github|README\.md|CHANGELOG\.md|SECURITY\.md|CONTRIBUTING\.md|LICENSE|_output)($|/)' ; then
            echo 'Development-only file found in release package.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: xenforo-clans-direct-install
          path: dist/*.zip
          if-no-files-found: error
